<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Visual Prompt Video Creator</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --accent: #818cf8;
      --accent-hover: #6366f1;
      --text: #f3f4f6;
      --border: #1f293d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 15px; }

    header { text-align: center; margin-bottom: 20px; }
    header h1 { color: var(--accent); font-size: 2rem; margin-bottom: 5px; }
    header p { color: #9ca3af; font-size: 0.95rem; }

    .app-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      max-width: 1300px;
      margin: 0 auto;
    }

    @media (min-width: 900px) {
      .app-container { grid-template-columns: 380px 1fr; }
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
    
    input[type="text"], textarea, select, input[type="range"] {
      width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border);
      background: #0b0f19; color: #fff; outline: none; font-size: 0.9rem;
    }

    .btn {
      background: var(--accent); color: #000; border: none; padding: 12px 16px;
      font-weight: 700; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:hover { background: var(--accent-hover); color: #fff; }
    .btn-secondary { background: #334155; color: #fff; }
    .btn-secondary:hover { background: #475569; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-success:hover { background: #059669; }

    .preview-container { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .canvas-wrapper {
      position: relative; width: 100%; max-width: 720px; aspect-ratio: 16/9;
      background: #000; border-radius: 12px; overflow: hidden; border: 2px solid var(--border);
    }
    canvas { width: 100%; height: 100%; display: block; }

    .filter-none { filter: none; }
    .filter-cinematic { filter: contrast(115%) saturate(130%) brightness(95%); }
    .filter-cyberpunk { filter: hue-rotate(180deg) saturate(200%) contrast(120%); }
    .filter-vintage { filter: sepia(60%) contrast(90%); }
    .filter-anime { filter: saturate(180%) contrast(110%); }

    .action-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; width: 100%; max-width: 720px; margin-top: 15px; }

    .storyboard {
      width: 100%; max-width: 720px; margin-top: 20px; background: #0b0f19;
      padding: 15px; border-radius: 8px; border: 1px solid var(--border);
    }
    .scene-list { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-top: 10px; }
    .scene-card {
      min-width: 140px; background: var(--card-bg); border: 2px solid var(--border);
      padding: 10px; border-radius: 8px; cursor: pointer; text-align: center;
    }
    .scene-card.active { border-color: var(--accent); background: #1e1b4b; }
  </style>
</head>
<body>

  <header>
    <h1>🎬 AI Visual Video Creator Studio</h1>
    <p>प्रॉम्प्ट से एनिमेटेड विज़ुअल्स, कैरेक्टर और वॉयस के साथ पूरा वीडियो बनाएं</p>
  </header>

  <div class="app-container">
    <div class="panel">
      <h3>🤖 AI Video Creator</h3>
      <br>

      <div class="form-group">
        <label>1. AI प्रॉम्प्ट / स्टोरी लिखें:</label>
        <textarea id="aiPrompt" rows="4" placeholder="उदाहरण: A space astronaut talking about the galaxy and discovering new stars."></textarea>
      </div>

      <div class="form-group">
        <label>2. विज़ुअल कैरेक्टर चुनें:</label>
        <select id="avatarSelect">
          <option value="robot">🤖 AI Robot Avatar</option>
          <option value="astronaut">🧑‍🚀 Astronaut / Space</option>
          <option value="presenter">🎙️ Digital Presenter</option>
        </select>
      </div>

      <div class="form-group">
        <label>3. थीम और फिल्टर:</label>
        <select id="styleSelect">
          <option value="filter-cinematic">Cinematic Movie</option>
          <option value="filter-cyberpunk">Cyberpunk Sci-Fi</option>
          <option value="filter-anime">3D Anime World</option>
          <option value="filter-vintage">Vintage Retro</option>
        </select>
      </div>

      <div class="form-group">
        <label>4. वॉयसओवर (Voice):</label>
        <select id="voiceSelect"></select>
      </div>

      <button class="btn" id="generateBtn">🚀 AI से विज़ुअल वीडियो बनाएं</button>
    </div>

    <div class="preview-container panel">
      <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="videoCanvas" width="1280" height="720"></canvas>
      </div>

      <div class="action-bar">
        <button class="btn" id="playAllBtn">▶️ वीडियो चलाएं</button>
        <button class="btn btn-success" id="exportBtn">⬇️ डाउनलोड (.WebM)</button>
        <button class="btn btn-secondary" id="shareBtn">🔗 शेयर करें</button>
      </div>

      <div class="storyboard">
        <h4>🎬 AI जनरेटेड सीन्स</h4>
        <div class="scene-list" id="sceneList"></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('videoCanvas');
    const ctx = canvas.getContext('2d');
    const canvasWrapper = document.getElementById('canvasWrapper');
    
    let scenes = [];
    let currentSceneIndex = 0;
    let synth = window.speechSynthesis;
    let voices = [];
    let isPlaying = false;
    let animFrameId = null;

    function populateVoices() {
      voices = synth.getVoices();
      const voiceSelect = document.getElementById('voiceSelect');
      voiceSelect.innerHTML = '';
      voices.forEach((voice, i) => {
        const option = document.createElement('option');
        option.textContent = `${voice.name} (${voice.lang})`;
        option.value = i;
        voiceSelect.appendChild(option);
      });
    }
    populateVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = populateVoices;
    }

    // Avatar SVG Drawers
    function drawAvatar(type, time) {
      ctx.save();
      const cx = canvas.width / 2;
      const cy = canvas.height / 2 + Math.sin(time * 0.003) * 15;

      if (type === 'robot') {
        // Head
        ctx.fillStyle = '#6366f1';
        ctx.fillRect(cx - 70, cy - 100, 140, 120);
        // Eyes (Glowing)
        ctx.fillStyle = '#00f0ff';
        ctx.beginPath();
        ctx.arc(cx - 30, cy - 50, 15 + Math.sin(time * 0.01) * 3, 0, Math.PI * 2);
        ctx.arc(cx + 30, cy - 50, 15 + Math.sin(time * 0.01) * 3, 0, Math.PI * 2);
        ctx.fill();
        // Mouth
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(cx - 30, cy - 10, 60, 8 + (isPlaying ? Math.sin(time * 0.02) * 10 : 0));
      } else if (type === 'astronaut') {
        // Helmet
        ctx.fillStyle = '#e2e8f0';
        ctx.beginPath();
        ctx.arc(cx, cy - 40, 90, 0, Math.PI * 2);
        ctx.fill();
        // Visor Reflection
        ctx.fillStyle = '#0284c7';
        ctx.beginPath();
        ctx.arc(cx, cy - 40, 65, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // Presenter Avatar
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath();
        ctx.arc(cx, cy - 50, 70, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Render Continuous Visual Canvas
    function renderFrame(timestamp) {
      if (!timestamp) timestamp = performance.now();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const currentScene = scenes[currentSceneIndex] || { text: "यहाँ आपका AI वीडियो दिखाई देगा", avatar: 'robot' };

      // Dynamic Animated Background
      const grad = ctx.createRadialGradient(
        canvas.width/2, canvas.height/2, 50,
        canvas.width/2, canvas.height/2, 600
      );
      grad.addColorStop(0, '#1e1b4b');
      grad.addColorStop(1, '#020617');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars/Particles Animation
      ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
      for (let i = 0; i < 30; i++) {
        let x = (Math.sin(i * 99 + timestamp * 0.0005) * 0.5 + 0.5) * canvas.width;
        let y = (Math.cos(i * 33 + timestamp * 0.0005) * 0.5 + 0.5) * canvas.height;
        ctx.fillRect(x, y, 3, 3);
      }

      // Draw Avatar
      drawAvatar(currentScene.avatar || 'robot', timestamp);

      // Subtitles Box
      if (currentScene.text) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
        ctx.fillRect(50, canvas.height - 130, canvas.width - 100, 90);
        ctx.font = "bold 26px sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.fillText(currentScene.text, canvas.width / 2, canvas.height - 75);
      }

      animFrameId = requestAnimationFrame(renderFrame);
    }

    document.getElementById('generateBtn').addEventListener('click', () => {
      const promptText = document.getElementById('aiPrompt').value.trim();
      if (!promptText) {
        alert("कृपया एक प्रॉम्प्ट दर्ज करें!");
        return;
      }

      const avatar = document.getElementById('avatarSelect').value;
      const style = document.getElementById('styleSelect').value;
      const voiceIndex = document.getElementById('voiceSelect').value;

      const sentences = promptText.match(/[^.!?]+[.!?]+/g) || [promptText];
      
      scenes = sentences.map((sentence) => {
        return {
          text: sentence.trim(),
          voiceIndex: voiceIndex,
          avatar: avatar,
          filter: style
        };
      });

      canvasWrapper.className = 'canvas-wrapper ' + style;
      updateStoryboardUI();
      currentSceneIndex = 0;
      alert(`AI ने ${scenes.length} विज़ुअल सीन्स तैयार किए हैं!`);
    });

    function updateStoryboardUI() {
      const sceneList = document.getElementById('sceneList');
      sceneList.innerHTML = '';
      scenes.forEach((sc, idx) => {
        const card = document.createElement('div');
        card.className = `scene-card ${idx === currentSceneIndex ? 'active' : ''}`;
        card.innerHTML = `<strong>Scene ${idx + 1}</strong><br><small>${sc.text.substring(0, 18)}...</small>`;
        card.onclick = () => { currentSceneIndex = idx; updateStoryboardUI(); };
        sceneList.appendChild(card);
      });
    }

    document.getElementById('playAllBtn').addEventListener('click', async () => {
      if (scenes.length === 0) { alert("पहले AI से वीडियो जनरेट करें!"); return; }

      for (let i = 0; i < scenes.length; i++) {
        currentSceneIndex = i;
        updateStoryboardUI();
        await playSceneAudio(scenes[i]);
      }
    });

    function playSceneAudio(scene) {
      return new Promise((resolve) => {
        const utterance = new SpeechSynthesisUtterance(scene.text);
        if (voices[scene.voiceIndex]) utterance.voice = voices[scene.voiceIndex];

        isPlaying = true;
        utterance.onend = () => {
          isPlaying = false;
          resolve();
        };

        synth.speak(utterance);
      });
    }

    // Export Video (.WebM)
    document.getElementById('exportBtn').addEventListener('click', () => {
      if (scenes.length === 0) { alert("एक्सपोर्ट के लिए सीन्स जनरेट करें!"); return; }

      const stream = canvas.captureStream(30);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      const chunks = [];

      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'AI_Visual_Video.webm';
        a.click();
      };

      recorder.start();
      document.getElementById('playAllBtn').click();

      const checkInterval = setInterval(() => {
        if (!synth.speaking) {
          clearInterval(checkInterval);
          recorder.stop();
        }
      }, 1000);
    });

    // Start Visual Loop
    requestAnimationFrame(renderFrame);
  </script>
</body>
</html>
